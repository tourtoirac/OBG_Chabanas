[project]
name = "chabanas"
version = "0.1.0"
description = ""
authors = [
    {name = "philippe@chignaguet.com"}
]
requires-python = ">=3.14"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "coverage (>=7.15.2,<8.0.0)",
    "ruff (>=0.16.6,<0.17.0)",
    "psycopg[binary,c,pool] (>=3.3.4,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-watchman (>=1.5.0,<2.0.0)",
    "mock (>=5.2.0,<6.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "wheel (>=0.48.0,<0.49.0)",
    "setuptools (>=84.0.0,<85.0.0)",
    "gunicorn[gevent] (>=26.0.0,<27.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "djangorestframework-stubs (>=3.17.0,<4.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
    "*/__init__.py",
    "*/tests.py",
    "*/migrations/*",
]